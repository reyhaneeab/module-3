<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Verdikt · Brightwave Studio Careers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    /* Layout: one centred card on a soft off-white page, Verdikt bar on top, honest footer below. */
    :root {
      --ink: #0F172A;          /* navy text */
      --ink-2: #334155;
      --muted: #475569;        /* slate secondary text, AA on white and off-white */
      --subtle: #64748B;       /* small print, AA on white only */
      --line: #E2E8F0;
      --line-2: #CBD5E1;
      --bg: #F7F8FC;
      --surface: #FFFFFF;
      --surface-2: #F8FAFC;
      --indigo: #4F46E5;
      --violet: #7C3AED;
      --indigo-50: #EEF2FF;
      --indigo-200: #C7D2FE;
      --ring: #A5B4FC;
      --red: #DC2626;
      --red-ink: #B91C1C;
      --red-50: #FEF2F2;
      --green: #16A34A;
      --green-ink: #15803D;
      --green-50: #F0FDF4;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 18px 48px -18px rgba(15, 23, 42, .18);
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body.modal-open { overflow: hidden; }
    h1, h2, h3 { margin: 0; text-wrap: balance; }
    p { margin: 0; }
    button { font: inherit; }
    svg { flex: none; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* Soft background shapes */
    .backdrop { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .backdrop::before, .backdrop::after {
      content: ""; position: absolute; border-radius: 50%; filter: blur(80px);
    }
    .backdrop::before {
      width: 560px; height: 560px; top: -220px; right: -160px;
      background: radial-gradient(circle at 35% 35%, #A5B4FC 0%, #C4B5FD 45%, transparent 70%);
      opacity: .55;
    }
    .backdrop::after {
      width: 460px; height: 460px; bottom: -240px; left: -180px;
      background: radial-gradient(circle, #BAE6FD 0%, transparent 70%);
      opacity: .5;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 688px;
      margin-inline: auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    /* Verdikt bar */
    .site-header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding-block: max(20px, env(safe-area-inset-top, 0px)) 0;
    }
    .vk-logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
    .vk-mark {
      width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      box-shadow: 0 6px 14px -6px rgba(79, 70, 229, .6);
    }
    .vk-mark svg { width: 18px; height: 18px; }
    .vk-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      background: rgba(255, 255, 255, .7); border: 1px solid var(--line);
    }
    .vk-tag .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(22, 163, 74, .18); }

    main.wrap { flex: 1; padding-block: clamp(16px, 5vh, 48px) 8px; }

    .card {
      background: var(--surface);
      border: 1px solid rgba(15, 23, 42, .06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(24px, 5.5vw, 44px);
    }

    .view { animation: viewIn 250ms var(--ease) both; }
    @keyframes viewIn {
      from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 18px)); }
      to { opacity: 1; transform: none; }
    }

    .stack { display: flex; flex-direction: column; gap: 24px; }
    .muted { color: var(--muted); }
    h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }
    .section-label {
      font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle);
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 50px; padding: 12px 22px; border-radius: var(--radius-sm);
      font-weight: 600; font-size: 16px; line-height: 1.2; text-decoration: none;
      border: 1px solid transparent; cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s, border-color .2s, color .2s, opacity .2s;
    }
    .btn svg { width: 18px; height: 18px; }
    .btn-block { width: 100%; }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      box-shadow: 0 8px 20px -10px rgba(79, 70, 229, .7);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 26px -10px rgba(79, 70, 229, .75); }
    .btn-primary:active:not(:disabled) { transform: translateY(0) scale(.985); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-2); }
    .btn-ghost:active:not(:disabled) { transform: scale(.985); }
    .btn-ghost:disabled, .btn-ghost[aria-disabled="true"], .btn-ghost[aria-disabled="true"]:hover {
      cursor: not-allowed; color: #94A3B8; background: var(--surface-2); border-color: var(--line); transform: none;
    }
    .shake { animation: shake .35s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    .textarea.textarea-sm { min-height: 84px; }
    .btn-locked { background: #F1F5F9; color: #64748B; border: 1px dashed var(--line-2); cursor: not-allowed; }
    .btn:focus-visible, .link-btn:focus-visible, .icon-btn:focus-visible {
      outline: 3px solid var(--ring); outline-offset: 2px;
    }

    /* Landing */
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .brand-row svg { width: 44px; height: 44px; }
    .brand-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
    .brand-sub { font-size: 14px; color: var(--muted); }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--indigo); }
    .title-block { display: flex; flex-direction: column; gap: 10px; }
    .landing h1 { font-size: clamp(28px, 5vw, 32px); line-height: 1.15; letter-spacing: -.025em; font-weight: 800; }
    .meta { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .meta li {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; color: var(--ink-2);
    }
    .meta svg { width: 15px; height: 15px; color: var(--subtle); }
    .lead { font-size: 17px; color: var(--ink-2); max-width: 60ch; }
    .traits { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
    .traits li { display: flex; gap: 14px; align-items: flex-start; }
    .trait-icon {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none;
      background: var(--indigo-50); color: var(--indigo);
    }
    .trait-icon svg { width: 20px; height: 20px; }
    .trait-text strong { display: block; font-size: 16px; line-height: 1.3; }
    .trait-text span { display: block; font-size: 15px; color: var(--muted); }
    .notice {
      display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(79, 70, 229, .07), rgba(124, 58, 237, .07));
      border: 1px solid var(--indigo-200); font-size: 15px; color: var(--ink-2);
    }
    .notice .vk-mark { width: 28px; height: 28px; border-radius: 8px; flex: none; }
    .notice .vk-mark svg { width: 15px; height: 15px; }

    /* Questions */
    .q-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
    .q-count { font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .q-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--subtle); font-weight: 500; }
    .q-tag svg { width: 14px; height: 14px; color: var(--violet); }
    .progress { height: 6px; border-radius: 999px; background: var(--indigo-50); overflow: hidden; margin-top: 12px; }
    .progress span {
      display: block; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, var(--indigo), var(--violet));
      transition: width .35s var(--ease);
    }
    .q-form { display: flex; flex-direction: column; gap: 32px; margin-top: 32px; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    legend { padding: 0; width: 100%; }
    .q-title { font-size: clamp(22px, 4vw, 28px); line-height: 1.3; letter-spacing: -.02em; font-weight: 700; }
    .q-helper { margin-top: 10px; font-size: 13px; color: var(--subtle); }
    .q-body { margin-top: 28px; }

    /* 1 to 5 scale */
    .scale-dots { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .dot { position: relative; width: 52px; height: 52px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
    .dot input, .choice input, .swatch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
    .dot-ui {
      display: grid; place-items: center; border-radius: 50%; background: var(--surface);
      border: 2px solid var(--line-2);
      transition: transform .2s var(--ease), border-color .2s, background .2s, box-shadow .2s;
    }
    .dot-ui svg { width: 45%; height: 45%; color: #fff; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s var(--ease); }
    .dot-xl .dot-ui { width: 46px; height: 46px; }
    .dot-lg .dot-ui { width: 38px; height: 38px; }
    .dot-md .dot-ui { width: 30px; height: 30px; }
    .dot:hover .dot-ui { border-color: var(--ring); transform: scale(1.06); }
    .dot input:checked + .dot-ui {
      border-color: transparent; background: linear-gradient(135deg, var(--indigo), var(--violet));
      box-shadow: 0 0 0 5px rgba(79, 70, 229, .14);
    }
    .dot input:checked + .dot-ui svg { opacity: 1; transform: none; }
    .dot input:focus-visible + .dot-ui { outline: 3px solid var(--ring); outline-offset: 3px; }
    .scale-ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
    .scale-ends span:last-child { text-align: right; }

    /* Single choice cards */
    .choices { display: grid; gap: 12px; }
    .choice {
      position: relative; display: flex; align-items: center; gap: 14px; padding: 15px 18px;
      border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
      cursor: pointer; font-size: 17px; font-weight: 500;
      transition: border-color .2s, background .2s, box-shadow .2s, transform .2s var(--ease);
    }
    .choice:hover { border-color: var(--ring); }
    .choice:active { transform: scale(.995); }
    .choice-mark {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    .choice input:checked + .choice-mark { border-color: var(--indigo); background: var(--indigo); box-shadow: inset 0 0 0 3px #fff; }
    .choice:has(input:checked) { border-color: var(--indigo); background: var(--indigo-50); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
    .choice:has(input:focus-visible), .swatch:has(input:focus-visible) { outline: 3px solid var(--ring); outline-offset: 2px; }

    /* Colour swatches */
    .swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .swatch {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 14px;
      border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer;
      font-weight: 600; font-size: 16px;
      transition: border-color .2s, background .2s, box-shadow .2s, transform .2s var(--ease);
    }
    .swatch:hover { border-color: var(--ring); transform: translateY(-1px); }
    .swatch-color { width: 56px; height: 56px; border-radius: 16px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .08), 0 6px 14px -8px var(--c); }
    .swatch:has(input:checked) { border-color: var(--indigo); background: var(--indigo-50); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }

    /* Free text */
    .textarea {
      width: 100%; min-height: 120px; resize: vertical; padding: 14px 16px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
      font: 400 17px/1.5 var(--font);
      transition: border-color .2s, box-shadow .2s;
    }
    .textarea::placeholder { color: #94A3B8; }
    .textarea:hover { border-color: var(--line-2); }
    .textarea:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(79, 70, 229, .14); }
    .text-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .nav { display: flex; justify-content: space-between; gap: 12px; }
    .nav .btn-primary { min-width: 150px; }

    /* Analyzing */
    .analyzing { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-block: 8px; }
    .ring { position: relative; width: 132px; height: 132px; margin-bottom: 8px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: var(--indigo-50); stroke-width: 9; }
    .ring-bar { fill: none; stroke: url(#ringGrad); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
    .ring-center { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; }
    .ring-center svg { width: 18px; height: 18px; color: var(--violet); transform: none; }
    .ring-pct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .analyzing h1 { font-size: clamp(22px, 4vw, 26px); line-height: 1.25; letter-spacing: -.02em; }
    .steps { list-style: none; margin: 12px 0 0; padding: 0; width: 100%; max-width: 380px; display: grid; gap: 10px; text-align: left; }
    .step {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--line); font-size: 15px; color: var(--ink-2);
      animation: stepIn .3s var(--ease) both;
    }
    @keyframes stepIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .step-icon { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--indigo-200); border-top-color: var(--indigo); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step .check-badge { display: none; }
    .step.done .spinner { display: none; }
    .step.done .check-badge { display: grid; }
    .check-badge { width: 20px; height: 20px; border-radius: 50%; place-items: center; background: var(--green); color: #fff; }
    .check-badge svg { width: 12px; height: 12px; }

    /* Result */
    .result { --tone: var(--red); --tone-ink: var(--red-ink); --tone-50: var(--red-50); }
    .result.is-approve { --tone: var(--green); --tone-ink: var(--green-ink); --tone-50: var(--green-50); }
    .result-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      font-size: 14px; font-weight: 600; color: var(--tone-ink); background: var(--tone-50);
      border: 1px solid color-mix(in srgb, var(--tone) 25%, transparent);
    }
    .pill svg { width: 15px; height: 15px; }
    .result-role { font-size: 14px; color: var(--muted); }
    .score-card { display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--radius-sm); background: var(--tone-50); }
    .score { display: flex; align-items: baseline; gap: 10px; }
    .score-num { font-size: clamp(56px, 13vw, 76px); font-weight: 800; line-height: 1; letter-spacing: -.045em; color: var(--tone); font-variant-numeric: tabular-nums; }
    .score-label { font-size: 18px; font-weight: 600; color: var(--tone-ink); }
    .meter { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .9); overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 18%, transparent); }
    .meter span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--tone); transition: width 1s var(--ease); }
    .result h1 { font-size: clamp(26px, 5vw, 32px); line-height: 1.2; letter-spacing: -.025em; font-weight: 800; }
    .headline-block { display: flex; flex-direction: column; gap: 8px; }
    .factors { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
    .factors li {
      display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--line); font-size: 16px; line-height: 1.5; color: var(--ink-2);
    }
    .factors li svg { width: 18px; height: 18px; margin-top: 3px; color: var(--tone); }
    .result-actions { display: grid; gap: 12px; }
    .apply-note { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--red-ink); }
    .apply-note svg { width: 16px; height: 16px; margin-top: 2px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line); color: #475569; }
    .model-line { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px; color: var(--subtle); text-align: center; }
    .model-line svg { width: 13px; height: 13px; color: var(--violet); }

    /* Submitted */
    .submitted { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding-block: 8px; }
    .big-check { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--green-50); color: var(--green); box-shadow: 0 0 0 10px rgba(22, 163, 74, .06); }
    .big-check svg { width: 34px; height: 34px; }
    .submitted h1 { font-size: clamp(24px, 4.6vw, 30px); line-height: 1.25; letter-spacing: -.02em; max-width: 22ch; }
    .submitted p { max-width: 46ch; }
    .summary { width: 100%; max-width: 420px; margin: 8px 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; text-align: left; }
    .summary div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; font-size: 15px; }
    .summary div + div { border-top: 1px solid var(--line); }
    .summary dt { color: var(--muted); }
    .summary dd { margin: 0; font-weight: 600; text-align: right; }

    /* Study survey (after the reveal) */
    .survey-head { display: flex; flex-direction: column; gap: 10px; }
    .survey-head .eyebrow { color: var(--violet); }
    .survey-head h1 { font-size: clamp(24px, 4.6vw, 30px); line-height: 1.2; letter-spacing: -.02em; font-weight: 800; }
    .survey-form { display: flex; flex-direction: column; margin-top: 12px; }
    .sq { padding-block: 22px; border-top: 1px solid var(--line); }
    .sq legend { font-size: 17px; font-weight: 600; line-height: 1.4; margin-bottom: 14px; }
    .seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .seg label, .chip { position: relative; cursor: pointer; }
    .seg input, .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
    .seg-btn {
      display: grid; place-items: center; min-height: 48px; border-radius: 10px; border: 1.5px solid var(--line);
      background: var(--surface); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums;
      transition: border-color .2s, background .2s, color .2s, box-shadow .2s;
    }
    .seg label:hover .seg-btn { border-color: var(--ring); }
    .seg input:checked + .seg-btn {
      color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--indigo), var(--violet));
      box-shadow: 0 6px 14px -8px rgba(79, 70, 229, .7);
    }

    }
    function nudge(el) {
      el.classList.remove('shake');
      void el.offsetWidth; // restart the animation
      el.classList.add('shake');
    }

    function show(html, dir = 1, focus = true) {
      $card.innerHTML = `<div class="view" style="--dir:${dir}">${html}</div>`;
      if (focus) {
        const target = $card.querySelector('h1');
        if (target) target.focus({ preventScroll: true });
        if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
      }
    }

    /* =====================================================================
       Scoring (a script, not a model: fair reading, then the opposite)
       ===================================================================== */
    const isScored = (q) => q.type === 'scale' || q.type === 'choice';
    const scalePoints = (v) => (v >= 4 ? 2 : v === 3 ? 1 : 0);
    const scaleBucket = (v) => (v >= 4 ? 'agree' : v === 3 ? 'neutral' : 'disagree');
    const pointsFor = (q, v) => (q.type === 'scale' ? scalePoints(v) : q.options[v].points);
    const byType = (type) => QUESTIONS.find((q) => q.type === type);

    function isAnswered(q, v) {
      if (q.type === 'text') return typeof v === 'string' && v.trim().length >= q.minLength;
      return typeof v === 'number';
    }
    const isComplete = () => QUESTIONS.every((q) => isAnswered(q, state.answers[q.id]));

    function findKeyword(text, keywords) {
      const words = (text.match(/[\p{L}\p{N}'’-]+/gu) || [])
        .map((w) => w.replace(/^['’-]+|['’-]+$/g, ''))
        .filter(Boolean);
      const hit = words.find((w) => keywords.some((k) => w.toLowerCase().startsWith(k)));
      if (hit) return hit;
      return words.reduce((longest, w) => (w.length > longest.length ? w : longest), '') || text.trim();
    }

    // What Verdikt "heard" for one answer. Colour and text lines depend on the verdict.
    function heardFor(q, v, verdict) {
      if (!isAnswered(q, v)) return null;
      switch (q.type) {
        case 'scale': return q.ai[scaleBucket(v)];
        case 'choice': return q.options[v].ai;
        case 'colour': return verdict ? fill(q.ai[verdict], { colour: q.options[v].label }) : null;
        case 'text': return verdict ? fill(q.ai[verdict], { keyword: findKeyword(v, q.keywords) }) : null;
        default: return null;
      }
    }

    function evaluate() {
      const { maxScore, goodFitThreshold, rejectRange, approveRange } = CONFIG.scoring;
      let score = 0;
      const scored = [];
      QUESTIONS.filter(isScored).forEach((q) => {
        const v = state.answers[q.id];
        const points = pointsFor(q, v);
        score += points;
        scored.push({ points, line: heardFor(q, v) });
      });
      const goodFit = score >= goodFitThreshold;
      const verdict = goodFit ? 'reject' : 'approve';   // always the opposite of a fair reading
      const target = goodFit ? 2 : 0;                    // misreadings that point the verdict's way
      const factors = scored.filter((s) => s.points === target).map((s) => s.line).slice(0, 3);
      CONFIG.result.fallbacks[verdict].forEach((line) => { if (factors.length < 3) factors.push(line); });
      const colourQ = byType('colour');
      const textQ = byType('text');
      factors.push(heardFor(colourQ, state.answers[colourQ.id], verdict));
      factors.push(heardFor(textQ, state.answers[textQ.id], verdict));
      // How far past the threshold the fair reading is (0 = borderline, 1 = extreme), mapped onto the verdict's range.
      const strength = goodFit
        ? (score - goodFitThreshold) / (maxScore - goodFitThreshold)
        : (goodFitThreshold - 1 - score) / (goodFitThreshold - 1);
      const [from, to] = goodFit ? rejectRange : approveRange;
      const match = Math.round(from + (to - from) * strength);
      return { score, maxScore, goodFit, verdict, match, factors };
    }

    function answerUI(q) {
      const current = state.answers[q.id];
      if (q.type === 'scale') {

          <div class="scale">
            <div class="scale-dots">
              ${order.map((m, pos) => `
                <label class="dot dot-${sizes[pos]}">
                  <input type="radio" name="${q.id}" value="${m}" ${current === m ? 'checked' : ''}>
                  <span class="dot-ui" aria-hidden="true">${ICONS.check}</span>
                  <span class="sr-only">${esc(CONFIG.scaleLabels[m])}</span>

    function renderAnalyzing() {
      state.screen = 'analyzing';
      state.finishedAt = performance.now();
      const a = CONFIG.analyzing;
      show(`
        <div class="analyzing">
          <div class="ring" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
              <circle class="ring-track" cx="60" cy="60" r="52"/>
              <circle class="ring-bar" cx="60" cy="60" r="52" pathLength="100"/>
            </svg>
            <div class="ring-center">${ICONS.sparkle}<span class="ring-pct">0%</span></div>
          </div>
          <h1 tabindex="-1">${esc(a.title)}</h1>
          <p class="muted">${esc(a.subtitle)}</p>
          <ol class="steps" aria-live="polite">
            ${a.steps.map((s) => `
              <li class="step" hidden>
                <span class="step-icon"><span class="spinner" aria-hidden="true"></span><span class="check-badge" aria-hidden="true">${ICONS.check}</span></span>
                <span>${esc(s)}</span>
              </li>`).join('')}
          </ol>
        </div>`);

      const ring = $card.querySelector('.ring-bar');
      const pctEl = $card.querySelector('.ring-pct');
      const items = Array.from($card.querySelectorAll('.step'));
      const duration = a.durationMs;
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        ring.style.strokeDashoffset = String(100 - t * 100);
        pctEl.textContent = `${Math.round(t * 100)}%`;
        if (t < 1) state.raf = requestAnimationFrame(tick);
      };
      state.raf = requestAnimationFrame(tick);

      const step = duration / items.length;
      items.forEach((li, k) => later(() => {
        if (k > 0) items[k - 1].classList.add('done');
        li.hidden = false;
      }, k * step));
      later(() => items[items.length - 1].classList.add('done'), duration);
      later(renderResult, duration + 500);
    }

    function renderResult() {
      state.screen = 'result';
      state.resultShownAt = performance.now();
      const r = evaluate();
      const c = CONFIG.result;
      const v = c[r.verdict];
      const reject = r.verdict === 'reject';
      const actions = reject ? `
          <button type="button" class="btn btn-block btn-locked" aria-disabled="true" data-action="locked-apply" aria-describedby="apply-note">${ICONS.lock}${esc(c.apply)}</button>
          <p class="apply-note" id="apply-note">${ICONS.alert}<span>${esc(v.applyNote)}</span></p>
          <button type="button" class="btn btn-block btn-ghost" aria-disabled="true" data-action="locked-review">${esc(v.review)} <span class="badge">${esc(v.reviewBadge)}</span></button>
          <button type="button" class="btn btn-block btn-primary" data-action="finish">${esc(c.continue)}${ICONS.arrowRight}</button>`
        : `<button type="button" class="btn btn-block btn-primary" data-action="apply">${esc(c.apply)}${ICONS.arrowRight}</button>`;

      show(`
        <div class="stack result ${reject ? 'is-reject' : 'is-approve'}">
          <div class="result-top">
            <span class="pill">${reject ? ICONS.alert : ICONS.checkCircle}${esc(v.pill)}</span>
            <span class="result-role">${esc(CONFIG.company.role)} · ${esc(CONFIG.company.name)}</span>
          </div>
          <div class="score-card">
            <div class="score" aria-hidden="true"><span class="score-num">0%</span><span class="score-label">${esc(c.matchLabel)}</span></div>
            <div class="meter" aria-hidden="true"><span></span></div>
            <p class="sr-only">${r.match}% ${esc(c.matchLabel)}</p>
          </div>
          <div class="headline-block">
            <h1 tabindex="-1">${esc(v.headline)}</h1>
            <p class="muted">${esc(fill(v.body, companyVars))}</p>
          </div>
          <div>
            <h2 class="section-label">${esc(c.factorsTitle)}</h2>
            <ul class="factors">
              ${r.factors.map((f) => `<li>${reject ? ICONS.alert : ICONS.checkCircle}<span>${esc(f)}</span></li>`).join('')}
            </ul>
          </div>
          <div class="result-actions">${actions}</div>
          <p class="model-line">${ICONS.sparkle}<span>${esc(CONFIG.product.modelLine)}</span></p>
        </div>`);

      const numEl = $card.querySelector('.score-num');
      const meter = $card.querySelector('.meter span');
      if (reduceMotion.matches) {
        numEl.textContent = `${r.match}%`;
        meter.style.width = `${r.match}%`;
        return;
      }
      requestAnimationFrame(() => requestAnimationFrame(() => { meter.style.width = `${r.match}%`; }));
      const start = performance.now();
      const duration = 1000;
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        numEl.textContent = `${Math.round(r.match * eased)}%`;
        if (t < 1) state.raf = requestAnimationFrame(tick);
      };
      state.raf = requestAnimationFrame(tick);
    }

    function renderSubmitted() {
      state.screen = 'submitted';
      const r = evaluate();
      const s = CONFIG.submitted;
      show(`

          <div class="big-check">${ICONS.check}</div>
          <h1 tabindex="-1">${esc(s.title)}</h1>

            <div><dt>${esc(s.ratingLabel)}</dt><dd>${esc(CONFIG.result[r.verdict].pill)} · ${r.match}% ${esc(CONFIG.result.matchLabel)}</dd></div>
          </dl>

      $modal.hidden = true;
      document.body.classList.remove('modal-open');
      backgroundRegions.forEach((el) => { el.inert = false; });
      if (restoreFocus && state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus({ preventScroll: true });
    }

    function restart() {
      clearTimers();
      Object.assign(state, freshState());
      closeDebrief(false);
      renderLanding(-1);
    }

    /* =====================================================================
       Study survey (after the result; required) and saved data
       ===================================================================== */
    function surveyUI(sq) {
      const cur = state.survey[sq.id];
      if (sq.type === 'scale') {
        return `
          <div class="seg">
            ${[1, 2, 3, 4, 5].map((n) => `
              <label><input type="radio" name="${sq.id}" value="${n}" ${cur === n ? 'checked' : ''}
                aria-label="${n}${n === 1 ? `, ${esc(sq.low)}` : n === 5 ? `, ${esc(sq.high)}` : ''}"><span class="seg-btn" aria-hidden="true">${n}</span></label>`).join('')}
          </div>
          <div class="seg-ends" aria-hidden="true"><span>1 = ${esc(sq.low)}</span><span>5 = ${esc(sq.high)}</span></div>`;
      }
      if (sq.type === 'multi') {
        const picked = Array.isArray(cur) ? cur : [];
        return `<div class="chips">${sq.options.map((o, k) => `
          <label class="chip"><input type="checkbox" name="${sq.id}" value="${k}" ${picked.includes(k) ? 'checked' : ''}><span class="chip-btn">${esc(o)}</span></label>`).join('')}</div>`;
      }
      if (sq.type === 'single') {
        return `<div class="choices compact">${sq.options.map((o, k) => `
          <label class="choice"><input type="radio" name="${sq.id}" value="${k}" ${cur === k ? 'checked' : ''}><span class="choice-mark" aria-hidden="true"></span><span>${esc(o)}</span></label>`).join('')}</div>`;
      }
      return `<textarea class="textarea textarea-sm" name="${sq.id}" rows="2" maxlength="${sq.maxLength}" placeholder="${esc(sq.placeholder)}" aria-labelledby="${sq.id}-label">${esc(cur || '')}</textarea>`;
    }

    function surveyAnswered(sq) {
      const v = state.survey[sq.id];
      if (sq.type === 'multi') return Array.isArray(v) && v.length > 0;
      if (sq.type === 'text') return typeof v === 'string' && v.trim().length >= (sq.minLength || 1);
      return typeof v === 'number';
    }
    const surveyReady = () => SURVEY.every((sq) => !sq.required || surveyAnswered(sq));

    function renderSurvey() {
      state.screen = 'survey';
      const s = CONFIG.survey;
      const ready = surveyReady();
      show(`
        <div class="survey-head">
          <p class="eyebrow">${esc(s.eyebrow)}</p>
          <h1 tabindex="-1">${esc(s.title)}</h1>
          <p class="muted">${esc(s.intro)}</p>
        </div>
        <form class="survey-form" novalidate>
          ${SURVEY.map((sq, i) => `
            <fieldset class="sq">
              <legend id="${sq.id}-label">${i + 1}. ${esc(sq.text)}</legend>
              ${surveyUI(sq)}
            </fieldset>`).join('')}
          <div class="survey-actions">
            <button type="submit" class="btn btn-primary btn-block" id="send-btn" ${ready ? '' : 'disabled'}>${esc(s.send)}</button>
            <p class="survey-hint" id="send-hint" ${ready ? 'hidden' : ''}>${esc(s.hint)}</p>
          </div>
        </form>`);
    }

    function onSurveyInput(e) {
      const t = e.target;
      const sq = SURVEY.find((q) => q.id === t.name);
      if (!sq) return;
      if (sq.type === 'multi') {
        const boxes = Array.from($card.querySelectorAll(`input[name="${sq.id}"]`));
        // An "exclusive" option (e.g. "None of them") can't be combined with the others.
        if (t.checked && typeof sq.exclusive === 'number') {
          const pickedExclusive = Number(t.value) === sq.exclusive;
          boxes.forEach((b) => {
            const isExclusive = Number(b.value) === sq.exclusive;
            if (pickedExclusive ? !isExclusive : isExclusive) b.checked = false;
          });
        }
        state.survey[sq.id] = boxes.filter((b) => b.checked).map((b) => Number(b.value));
      } else if (sq.type === 'text') {
        state.survey[sq.id] = t.value;
      } else {
        state.survey[sq.id] = Number(t.value);
      }
      const ready = surveyReady();
      $('#send-btn').disabled = !ready;
      $('#send-hint').hidden = ready;
    }

    // One flat row per participant: test result, every test answer, timings and the survey.
    function buildRecord() {
      const r = evaluate();
      const fair = CONFIG.survey.fairLabels;
      const rec = {
        response_id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
        submitted_at: new Date().toISOString(),
        device: window.matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse',
        screen_width: window.innerWidth,
        verdikt_said: CONFIG.result[r.verdict].pill,
        fair_reading: r.goodFit ? fair.good : fair.poor,
        fair_score: r.score,
        match_shown_pct: r.match,
        applied: state.applied ? 'yes' : 'no',
        test_time_s: secs(state.finishedAt - state.startedAt),
        result_time_s: secs((state.resultLeftAt || performance.now()) - state.resultShownAt),
        clicked_locked_apply: state.lockedApplyClicks,
        clicked_human_review: state.reviewClicks
      };
      QUESTIONS.forEach((q) => {
        const v = state.answers[q.id];
        if (q.type === 'scale') {
          rec[`${q.id}_value`] = v;
          rec[`${q.id}_answer`] = CONFIG.scaleLabels[v];
        } else if (q.type === 'text') {
          rec[`${q.id}_answer`] = v.trim();
          rec[`${q.id}_keyword`] = findKeyword(v, q.keywords);
        } else {
          rec[`${q.id}_answer`] = q.options[v].label;
        }
        if (isScored(q)) rec[`${q.id}_points`] = pointsFor(q, v);
        if (q.reversed) rec[`${q.id}_clicked_side`] = v >= 4 ? 'left' : v <= 2 ? 'right' : 'middle';
        if (typeof q.hiddenAnswer === 'number') rec[`${q.id}_followed_small_print`] = v === q.hiddenAnswer ? 'yes' : 'no';
        rec[`${q.id}_time_s`] = secs(state.times[q.id] || 0);
      });
      SURVEY.forEach((sq) => {
        const v = state.survey[sq.id];
        if (sq.type === 'multi') rec[sq.id] = (v || []).map((k) => sq.options[k]).join('; ');
        else if (sq.type === 'single') rec[sq.id] = typeof v === 'number' ? sq.options[v] : '';
        else if (sq.type === 'text') rec[sq.id] = (v || '').trim();
        else rec[sq.id] = typeof v === 'number' ? v : '';
      });
      return rec;
    }

    function readLocal() {
      try {
        const rows = JSON.parse(localStorage.getItem(CONFIG.survey.storageKey) || '[]');
        return Array.isArray(rows) ? rows : [];
      } catch (err) { return []; }
    }
    function writeLocal(rows) {
      try { localStorage.setItem(CONFIG.survey.storageKey, JSON.stringify(rows)); return true; }
      catch (err) { return false; }
    }

    // Always keep a copy on this device; also send to the Google Sheet when an endpoint is set.
    async function saveRecord(rec) {
      const savedLocally = writeLocal(readLocal().concat([rec]));
      const url = (CONFIG.survey.endpoint || '').trim();
      if (!url) return savedLocally;
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 8000);
      try {
        await fetch(url, {
          method: 'POST', mode: 'no-cors', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(rec)
        });
        return true;
      } catch (err) {
        console.warn('Verdikt: could not reach the Google Sheet. The answers are still saved on this device.', err);
        return savedLocally;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function submitSurvey() {
      if (!surveyReady() || !isComplete()) return;
      const btn = $('#send-btn');
      btn.disabled = true;
      btn.textContent = CONFIG.survey.sending;
      const ok = await saveRecord(buildRecord());
      renderThanks(ok ? 'saved' : 'failed');
    }

    function renderThanks(status) {
      state.screen = 'thanks';
      const t = CONFIG.thanks;
      show(`
        <div class="submitted">
          <div class="big-check">${ICONS.check}</div>
          <h1 tabindex="-1">${esc(t.title)}</h1>
          <p class="muted">${esc(t[status])}</p>
          <button type="button" class="btn btn-primary" data-action="restart">${esc(t.restart)}</button>
        </div>`);
    }

    function toCSV(rows) {
      const headers = [];
      rows.forEach((r) => Object.keys(r).forEach((k) => { if (!headers.includes(k)) headers.push(k); }));
      const cell = (v) => {
        let s = v === undefined || v === null ? '' : String(v);
        if (/^[=+\-@]/.test(s)) s = `'${s}`; // stop spreadsheet formula injection from free text
        return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      return [headers.map(cell).join(','), ...rows.map((r) => headers.map((h) => cell(r[h])).join(','))].join('\r\n');
    }

    function downloadCSV() {
      const rows = readLocal();
      if (!rows.length) return;
      const url = URL.createObjectURL(new Blob(['﻿', toCSV(rows)], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `verdikt-responses-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const responsesLabel = (n) => `${n} ${n === 1 ? 'response' : 'responses'}`;

    function clearLocal(btn) {
      const n = readLocal().length;
      if (!btn.dataset.armed) {
        btn.dataset.armed = '1';
        btn.textContent = fill(CONFIG.debrief.clearConfirm, { n: responsesLabel(n) });
        return;
      }
      try { localStorage.removeItem(CONFIG.survey.storageKey); } catch (err) { /* storage unavailable */ }
      const box = $('#facilitator');
      if (box) box.outerHTML = facilitatorHTML();
    }

    function facilitatorHTML() {
      const d = CONFIG.debrief;
      const n = readLocal().length;
      const sheet = (CONFIG.survey.endpoint || '').trim() ? d.sheetOn : d.sheetOff;
      return `
        <div class="facilitator" id="facilitator">
          <span class="facilitator-status">${esc(fill(d.facilitator, { n: responsesLabel(n) }))} ${esc(sheet)}</span>
          <button type="button" class="btn btn-ghost" data-action="download-csv" ${n ? '' : 'disabled'}>${esc(d.download)}</button>
          <button type="button" class="btn btn-ghost" data-action="clear-data" ${n ? '' : 'disabled'}>${esc(d.clear)}</button>
        </div>`;
    }

    /* =====================================================================
       Events
       ===================================================================== */
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      switch (el.dataset.action) {
        case 'start': state.index = 0; state.startedAt = performance.now(); renderQuestion(1); break;
        case 'back':
          stopClock();
          if (state.index === 0) renderLanding(-1);
          else { state.index -= 1; renderQuestion(-1); }
          break;
        case 'apply': leaveResult(); state.applied = true; renderSubmitted(); break;
        case 'locked-apply': state.lockedApplyClicks += 1; nudge(el); break;
        case 'locked-review': state.reviewClicks += 1; nudge(el); break;
        case 'home': restart(); break;
        case 'finish': leaveResult(); renderSurvey(); break;
        case 'about': openDebrief(el); break;
        case 'close': closeDebrief(); break;
        case 'restart': restart(); break;
        case 'download-csv': downloadCSV(); break;
        case 'clear-data': clearLocal(el); break;
        default: break;
      }
    });

    function onAnswer(e) {
      if (state.screen === 'survey') { onSurveyInput(e); return; }
      if (state.screen !== 'question') return;
      const q = QUESTIONS[state.index];
      const t = e.target;
      if (t.name !== q.id) return;
      state.answers[q.id] = q.type === 'text' ? t.value : Number(t.value);
      const next = $('#next-btn');
      if (next) next.disabled = !isAnswered(q, state.answers[q.id]);
      if (q.type === 'text') {
        const counter = $card.querySelector('.counter');
        if (counter) counter.textContent = `${t.value.length} / ${q.maxLength}`;
      }
    }
    $card.addEventListener('change', onAnswer);
    $card.addEventListener('input', onAnswer);

    $card.addEventListener('submit', (e) => {
      e.preventDefault();
      if (state.screen === 'survey') { submitSurvey(); return; }
      const q = QUESTIONS[state.index];
      if (!isAnswered(q, state.answers[q.id])) return;
      stopClock();
      if (state.index < TOTAL - 1) { state.index += 1; renderQuestion(1); }
      else renderAnalyzing();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !$modal.hidden) { e.preventDefault(); closeDebrief(); }
    });

    /* =====================================================================
       Boot
       ===================================================================== */
    document.querySelectorAll('[data-icon]').forEach((el) => { el.insertAdjacentHTML('afterbegin', ICONS[el.dataset.icon]); });
    $('#vk-name').textContent = CONFIG.product.name;
    $('#vk-tagline').textContent = CONFIG.product.tagline;
    $('#footer-text').textContent = CONFIG.footer.text;
    $('#footer-link').textContent = CONFIG.footer.link;
    $('#debrief-eyebrow').textContent = CONFIG.debrief.eyebrow;
    renderLanding(1, false);
  })();
  </script>
</body>
</html>
